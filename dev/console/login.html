<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>御端 · 登录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
      background:linear-gradient(135deg,#1e3a8a,#0ea5e9); color:#1f2430; }
    .card { background:#fff; border-radius:18px; padding:32px 28px; width:340px; box-shadow:0 18px 50px rgba(0,0,0,.25); }
    h1 { font-size:20px; margin:0 0 4px; color:#1e3a8a; }
    .sub { font-size:12px; color:#6b7280; margin-bottom:20px; }
    label { display:block; font-size:13px; color:#374151; margin:12px 0 6px; }
    input { width:100%; padding:10px 12px; border:1px solid #e4e7ef; border-radius:10px; font-size:14px; }
    button { width:100%; margin-top:20px; padding:11px; background:#1e3a8a; color:#fff; border:none;
      border-radius:10px; font-size:15px; cursor:pointer; }
    button:hover { opacity:.92; }
    .msg { margin-top:14px; font-size:13px; color:#dc2626; min-height:18px; }
    .hint { margin-top:16px; font-size:12px; color:#9ca3af; line-height:1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>御端 · 管理控制台</h1>
    <div class="sub">企业终端统一管理平台</div>
    <label>账号</label>
    <input id="u" placeholder="admin" autocomplete="username" />
    <label>密码</label>
    <input id="p" type="password" placeholder="密码" autocomplete="current-password" />
    <button id="loginBtn">登录</button>
    <div class="msg" id="msg"></div>
    <div class="hint">
      演示账号：<br/>
      admin / admin123（管理员）<br/>
      operator / operator123（运维）<br/>
      viewer / viewer123（只读）
    </div>
  </div>
  <script>
    document.getElementById('loginBtn').onclick = async () => {
      const u = document.getElementById('u').value;
      const p = document.getElementById('p').value;
      const msg = document.getElementById('msg');
      msg.textContent = '登录中…';
      try {
        const r = await fetch('/api/v1/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username:u, password:p})
        });
        const j = await r.json();
        if (j.code === 0) {
          localStorage.setItem('yd_token', j.token);
          localStorage.setItem('yd_role', j.role);
          localStorage.setItem('yd_user', u);
          if (j.must_change_password) {
            // 强制改密：仅放行改密页
            location.href = 'change-password.html?forced=1';
          } else {
            location.href = 'index.html';
          }
        } else {
          msg.textContent = j.message || '登录失败';
        }
      } catch(e) { msg.textContent = '网络错误'; }
    };
    document.getElementById('p').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('loginBtn').click(); });
  </script>
</body>
</html>
