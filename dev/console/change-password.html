<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>御端 · 修改密码</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
      background:linear-gradient(135deg,#1e3a8a,#0ea5e9); color:#1f2430; }
    .card { background:#fff; border-radius:18px; padding:32px 28px; width:360px; box-shadow:0 18px 50px rgba(0,0,0,.25); }
    h1 { font-size:20px; margin:0 0 4px; color:#1e3a8a; }
    .sub { font-size:12px; color:#6b7280; margin-bottom:16px; }
    .notice { font-size:12px; background:#fff7ed; color:#9a3412; border:1px solid #fed7aa;
      border-radius:10px; padding:10px 12px; margin-bottom:16px; line-height:1.6; }
    label { display:block; font-size:13px; color:#374151; margin:12px 0 6px; }
    input { width:100%; padding:10px 12px; border:1px solid #e4e7ef; border-radius:10px; font-size:14px; }
    button { width:100%; margin-top:20px; padding:11px; background:#1e3a8a; color:#fff; border:none;
      border-radius:10px; font-size:15px; cursor:pointer; }
    button:hover { opacity:.92; }
    .msg { margin-top:14px; font-size:13px; color:#dc2626; min-height:18px; }
    .ok { color:#15803d; }
    .hint { margin-top:16px; font-size:12px; color:#9ca3af; line-height:1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>修改密码</h1>
    <div class="sub" id="who">账号：-</div>
    <div class="notice" id="notice" style="display:none">
      当前账号被要求强制修改密码：改密完成前，除本页面外的所有操作均被禁止。
    </div>
    <label>当前密码</label>
    <input id="old" type="password" autocomplete="current-password" />
    <label>新密码（至少 10 位，含大写/小写/数字/符号中三类）</label>
    <input id="new" type="password" autocomplete="new-password" />
    <label>确认新密码</label>
    <input id="confirm" type="password" autocomplete="new-password" />
    <button id="btn">确认修改</button>
    <div class="msg" id="msg"></div>
    <div class="hint">口令经 argon2id（64MiB）加盐哈希后存储；改密成功后可使用新密码重新登录。</div>
  </div>
  <script>
    (function () {
      const token = localStorage.getItem('yd_token');
      if (!token) { location.href = 'login.html'; return; }
      document.getElementById('who').textContent = '账号：' + (localStorage.getItem('yd_user') || '-');
      if (new URLSearchParams(location.search).get('forced') === '1') {
        document.getElementById('notice').style.display = 'block';
      }
      document.getElementById('btn').onclick = async () => {
        const oldPw = document.getElementById('old').value;
        const newPw = document.getElementById('new').value;
        const confirmPw = document.getElementById('confirm').value;
        const msg = document.getElementById('msg');
        msg.className = 'msg';
        if (!oldPw || !newPw) { msg.textContent = '请填写完整'; return; }
        if (newPw !== confirmPw) { msg.textContent = '两次输入的新密码不一致'; return; }
        msg.textContent = '提交中…';
        try {
          const r = await fetch('/api/v1/password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ old_password: oldPw, new_password: newPw })
          });
          const j = await r.json();
          if (j.code === 0) {
            if (j.token) {
              localStorage.setItem('yd_token', j.token);
            }
            msg.className = 'msg ok';
            msg.textContent = '修改成功，正在进入控制台…';
            setTimeout(() => { location.href = 'index.html'; }, 800);
          } else {
            msg.textContent = j.message || '修改失败';
          }
        } catch (e) { msg.textContent = '网络错误'; }
      };
      document.getElementById('confirm').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('btn').click();
      });
    })();
  </script>
</body>
</html>
