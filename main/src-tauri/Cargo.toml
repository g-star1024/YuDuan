[package]
name = "yuduan-main"
version = "0.1.0"
description = "御端 · 终端统一管理平台 主端桌面客户端"
edition = "2021"

# 见 lib.rs：desktop 入口
[lib]
name = "yuduan_main_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 无头验收二进制：对真实 hub 跑登录/设备/指令（curl 同口径），CI/开发联调用
[[bin]]
name = "hubcheck"
path = "src/bin/hubcheck.rs"

# 无头验收：P2P 直连媒体路径（对真实 hub + Rust 副端跑 ICE-lite 升级与收帧/解码）
[[bin]]
name = "p2pcheck"
path = "src/bin/p2pcheck.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 仅 Unix 需要：P2P 候选枚举走 getifaddrs（Windows 走 GetIpAddrTable，见 p2p.rs）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
